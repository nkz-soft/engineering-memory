# Engine-only development entry point; product stack extends the same service.
name: engineering-memory-hindsight-dev
services:
  hindsight:
    extends:
      file: service.yaml
      service: hindsight
    ports:
    - 127.0.0.1:${HINDSIGHT_DEV_PORT:-8888}:8888
    environment:
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_API_LLM_BASE_URL:?Set the container-reachable
        proxy API URL}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:?Set the existing proxy model
        alias}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:?Set the proxy key or
        a nonsecret placeholder for a keyless proxy}
volumes:
  hindsight-data: null
