# Canonical engine configuration. Entry points supply routing and host bindings.
services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:1.2.0@sha256:19d0c08f3df79acac29384826419a1ca158129e81ec527cdcbd8c97ff4ef76da
    shm_size: 1gb
    volumes:
    - hindsight-data:/home/hindsight/.pg0
    extra_hosts:
    - host.docker.internal:host-gateway
    environment:
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_API_RERANKER_PROVIDER: local
      HINDSIGHT_API_WORKER_ID: ${COMPOSE_PROJECT_NAME:-engineering-memory-dev}
      HINDSIGHT_API_LOG_LEVEL: warning
      HINDSIGHT_API_LLM_HTTP_LOG_LEVEL: WARNING
      HINDSIGHT_API_LLM_DEBUG_DUMP_4XX: 'false'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health/ready',
        timeout=5).close()
      interval: 5s
      timeout: 6s
      start_period: 30s
      retries: 60
