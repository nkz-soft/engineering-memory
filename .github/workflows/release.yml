name: Workstation installers

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
          - os: ubuntu-24.04
            platform: ubuntu-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
      - run: uv sync --locked --no-dev --group release
      - name: Build the versioned CLI payload
        id: payload
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(uv run --no-sync python -c 'import importlib.metadata as m; print(m.version("engineering-memory"))')
          tag="v$version"
          if [[ "$REF_TYPE" == tag ]]; then tag="$REF_NAME"; fi
          uv run --no-sync python packaging/workstation/build.py "$tag" build/payload
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package Ubuntu installer
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.payload.outputs.version }}
        run: |
          bash packaging/workstation/build-deb.sh build/payload/engineering-memory build/assets "$VERSION"
          launcher="build/assets/engineering-memory-$VERSION-ubuntu-amd64-install.sh"
          sed "s/@VERSION@/$VERSION/g" packaging/workstation/install-ubuntu.sh > "$launcher"
          bash -n "$launcher"
      - name: Package and smoke-test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.payload.outputs.version }}
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'innosetup-6.5.4.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_5_4/innosetup-6.5.4.exe' -OutFile $tool
          if ((Get-FileHash $tool -Algorithm SHA256).Hash -ne 'fa73bf47a4da250d185d07561c2bfda387e5e20db77e4570004cf6a133cc10b1') { throw 'Inno Setup checksum mismatch' }
          $toolDir = Join-Path $env:RUNNER_TEMP 'inno-6.5.4'
          $process = Start-Process -FilePath $tool -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',('/DIR="' + $toolDir + '"') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $compiler = Join-Path $toolDir 'ISCC.exe'
          $payload = (Resolve-Path build/payload/engineering-memory).Path
          $output = (New-Item -Force -ItemType Directory build/assets).FullName
          $identity = (Get-FileHash -LiteralPath (Join-Path $payload 'engineering-memory.build')).Hash.ToLowerInvariant()
          & $compiler "/DAppVersion=$env:VERSION" "/DBuildIdentity=$identity" "/DPayload=$payload" "/O$output" packaging/workstation/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Join-Path $output "engineering-memory-$env:VERSION-windows-x64-setup.exe"
          function Install-Silent([string]$mode, [string]$log) {
            $process = Start-Process -FilePath $installer -ArgumentList $mode,'/SUPPRESSMSGBOXES','/NORESTART',('/LOG="' + $log + '"') -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Windows installer exited with $($process.ExitCode)" }
          }
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'silent-codex-profile'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'silent-claude-profile'
          $profile = Join-Path $env:LOCALAPPDATA 'EngineeringMemory'
          if (Test-Path -LiteralPath $profile) { throw 'Expected a clean runner profile' }
          Install-Silent '/VERYSILENT' (Join-Path $env:RUNNER_TEMP 'install-very-silent.log')
          if (Test-Path -LiteralPath $profile) { throw 'Silent install created a workstation profile' }

          $config = (New-Item -ItemType Directory (Join-Path $profile 'config') -Force).FullName
          $compose = Join-Path $config 'compose.env'
          $app = Join-Path $config 'app.env'
          Set-Content -LiteralPath $compose -Value 'PRODUCT_PROVIDER_MODEL=custom_openai/fixture'
          Set-Content -LiteralPath $app -Value 'ENGINEERING_MEMORY_LLM__BASE_URL=http://127.0.0.1:4500/v1'
          $before = (Get-FileHash -LiteralPath $compose,$app).Hash -join ':'
          Install-Silent '/SILENT' (Join-Path $env:RUNNER_TEMP 'install-silent.log')
          $after = (Get-FileHash -LiteralPath $compose,$app).Hash -join ':'
          if ($before -ne $after) { throw 'Silent reinstall changed the workstation profile' }
          if ((Test-Path -LiteralPath $env:CODEX_HOME) -or (Test-Path -LiteralPath $env:CLAUDE_CONFIG_DIR)) {
            throw 'Silent install created a client profile'
          }

          $path = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = "$path;$env:Path"
          $installed = (Get-Command engineering-memory -CommandType Application).Source
          uv run --no-sync python packaging/workstation/smoke.py $installed $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = (Resolve-Path .venv/Scripts/python.exe).Path
          & packaging/workstation/test-windows-maintenance.ps1 -Compiler $compiler -Python $python -Scratch (Join-Path $env:RUNNER_TEMP 'engineering-memory-maintenance-matrix')
          & packaging/workstation/test-windows-mcp.ps1 -Compiler $compiler -Python $python -Scratch (Join-Path $env:RUNNER_TEMP 'engineering-memory-mcp-wizard')
      - name: Generate package checksum
        run: |
          cd build/assets
          for installer in *; do
            sha256sum "$installer" > "$installer.sha256"
            sha256sum -c "$installer.sha256"
          done
      - name: Verify Ubuntu installer handoff
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.payload.outputs.version }}
        run: |
          launcher="build/assets/engineering-memory-$VERSION-ubuntu-amd64-install.sh"
          package="build/assets/engineering-memory_${VERSION}_amd64.deb"
          root_code=0
          root_output=$(sudo bash "$launcher" "./$package" 2>&1) || root_code=$?
          test "$root_code" -eq 1
          grep -F 'Run the installer as your regular user without sudo.' <<< "$root_output"
          # Exercise apt and the installed wizard in a PTY without provider credentials.
          code=0
          output=$(ENGINEERING_MEMORY_HINDSIGHT__BASE_URL=http://127.0.0.1:1 \
            script --quiet --return --command "bash '$launcher' './$package'" /dev/null </dev/null) || code=$?
          printf '%s\n' "$output"
          test "$code" -eq 1
          grep -F 'Unset these environment overrides' <<< "$output"
          grep -F 'Guided setup failed' <<< "$output"
          uv run --no-sync python packaging/workstation/smoke_launcher.py "$launcher" "./$package"
          uv run --no-sync python packaging/workstation/smoke.py /usr/bin/engineering-memory "$VERSION"
          uv run --locked --group release pytest -q tests/structure/test_ubuntu_installer.py
          # Exercise the same decision matrix against the real apt and dpkg database.
          installed=/opt/engineering-memory/engineering-memory
          before=$(stat -c '%i:%y' "$installed")
          bash "$launcher" --non-interactive "./$package"
          test "$before" = "$(stat -c '%i:%y' "$installed")"

          scratch=$(mktemp -d)
          cp -a build/payload/engineering-memory "$scratch/payload"
          printf '%s\n' 'Synthetic package variant' > "$scratch/payload/maintenance-fixture"
          bash packaging/workstation/build-deb.sh "$scratch/payload" "$scratch" "$VERSION"
          alternate="engineering-memory_${VERSION}_amd64.deb"
          (cd "$scratch" && sha256sum "$alternate" > "$alternate.sha256")
          if bash "$launcher" --non-interactive "$scratch/$alternate"; then
            echo 'Unattended same-version replacement unexpectedly succeeded' >&2
            exit 1
          fi
          test "$before" = "$(stat -c '%i:%y' "$installed")"

          upgrade="${VERSION}.1"
          upgraded="engineering-memory_${upgrade}_amd64.deb"
          sed "s/@VERSION@/$upgrade/g" packaging/workstation/install-ubuntu.sh > "$scratch/install-upgrade.sh"
          bash packaging/workstation/build-deb.sh "$scratch/payload" "$scratch" "$upgrade"
          (cd "$scratch" && sha256sum "$upgraded" > "$upgraded.sha256")
          bash "$scratch/install-upgrade.sh" --non-interactive "$scratch/$upgraded"
          if bash "$launcher" --non-interactive "./$package"; then
            echo 'Unattended downgrade unexpectedly succeeded' >&2
            exit 1
          fi
          test "$(dpkg-query -W -f='${Version}' engineering-memory)" = "$upgrade"
      - name: Record review build commit
        if: github.event_name == 'pull_request'
        run: git rev-parse HEAD > build/assets/BUILD-COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-memory-${{ matrix.platform }}
          path: build/assets/
          if-no-files-found: error

  draft:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: workstation-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          pattern: engineering-memory-*
          merge-multiple: true
          path: assets
      - name: Verify both targets and create a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          windows="engineering-memory-$version-windows-x64-setup.exe"
          linux="engineering-memory_${version}_amd64.deb"
          launcher="engineering-memory-$version-ubuntu-amd64-install.sh"
          assets=("$windows" "$linux" "$launcher")
          cd assets
          shopt -s dotglob nullglob
          downloaded=(*)
          test "${#downloaded[@]}" -eq "$(( 2 * ${#assets[@]} ))"
          release_files=()
          for asset in "${assets[@]}"; do
            test -s "$asset"
            test "$(wc -l < "$asset.sha256")" -eq 1
            test "$(cut -d ' ' -f 3 "$asset.sha256")" = "$asset"
            sha256sum -c "$asset.sha256"
            release_files+=("$asset" "$asset.sha256")
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "A release already exists for $TAG. Keep its reviewed bytes or remove the draft before retrying."
            exit 1
          fi
          guide="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$TAG/docs/operations/workstation-install.md"
          cat > notes.md <<EOF
          Engineering Memory $version provides one interactive installer to install and start the product on Windows 11 x64 and Ubuntu 24.04 LTS amd64. Docker and a compatible LLM provider are prerequisites.

          [Platform installation, checksum verification, setup and MCP instructions]($guide)
          EOF
          gh release create "$TAG" "${release_files[@]}" \
            --verify-tag --draft --title "Engineering Memory $TAG" --notes-file notes.md
